<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Marker A: 1200x1200 canvas, 100px padding, central marker 800x800 (8x8 grid) -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <!-- outer border square -->
  <rect x="100" y="100" width="1000" height="1000" fill="#ffffff" stroke="#000000" stroke-width="12" />

  <!-- central marker area (800x800) positioned at (200,200) to (1000,1000) -->
  <!-- 8x8 grid, cell size 100 -->
  <g id="grid" transform="translate(200,200)">
    <!-- Pattern (8x8). 1 = black, 0 = white. Cell size = 100 -->
    <!-- Row 0 -->
    <rect x="0" y="0" width="100" height="100" fill="#000" />
    <rect x="100" y="0" width="100" height="100" fill="#000" />
    <rect x="200" y="0" width="100" height="100" fill="#000" />
    <rect x="300" y="0" width="100" height="100" fill="#000" />
    <rect x="400" y="0" width="100" height="100" fill="#000" />
    <rect x="500" y="0" width="100" height="100" fill="#000" />
    <rect x="600" y="0" width="100" height="100" fill="#000" />
    <rect x="700" y="0" width="100" height="100" fill="#000" />
    <!-- Row 1 -->
    <rect x="0" y="100" width="100" height="100" fill="#000" />
    <rect x="100" y="100" width="100" height="100" fill="#fff" />
    <rect x="200" y="100" width="100" height="100" fill="#fff" />
    <rect x="300" y="100" width="100" height="100" fill="#fff" />
    <rect x="400" y="100" width="100" height="100" fill="#fff" />
    <rect x="500" y="100" width="100" height="100" fill="#fff" />
    <rect x="600" y="100" width="100" height="100" fill="#fff" />
    <rect x="700" y="100" width="100" height="100" fill="#000" />
