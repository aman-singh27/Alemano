    <rect x="400" y="700" width="100" height="100" fill="#000" />
    <rect x="500" y="700" width="100" height="100" fill="#000" />
    <rect x="600" y="700" width="100" height="100" fill="#000" />
    <rect x="700" y="700" width="100" height="100" fill="#000" />
