    <rect x="0" y="200" width="100" height="100" fill="#000" />
    <rect x="100" y="200" width="100" height="100" fill="#fff" />
    <rect x="200" y="200" width="100" height="100" fill="#000" />
    <rect x="300" y="200" width="100" height="100" fill="#000" />
    <rect x="400" y="200" width="100" height="100" fill="#000" />
    <rect x="500" y="200" width="100" height="100" fill="#111" />
    <rect x="600" y="200" width="100" height="100" fill="#000" />
    <rect x="700" y="200" width="100" height="100" fill="#000" />
    <!-- Row 3 -->
    <rect x="0" y="300" width="100" height="100" fill="#000" />
    <rect x="100" y="300" width="100" height="100" fill="#fff" />
