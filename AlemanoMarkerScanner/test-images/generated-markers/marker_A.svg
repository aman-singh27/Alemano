    <rect x="700" y="500" width="100" height="100" fill="#000" />
    <!-- Row 6 -->
    <rect x="0" y="600" width="100" height="100" fill="#000" />
    <rect x="100" y="600" width="100" height="100" fill="#000" />
    <rect x="200" y="600" width="100" height="100" fill="#000" />
    <rect x="300" y="600" width="100" height="100" fill="#000" />
    <rect x="400" y="600" width="100" height="100" fill="#000" />
    <rect x="500" y="600" width="100" height="100" fill="#000" />
