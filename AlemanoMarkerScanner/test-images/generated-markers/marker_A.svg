    <rect x="700" y="300" width="100" height="100" fill="#000" />
    <!-- Row 4 -->
    <rect x="0" y="400" width="100" height="100" fill="#000" />
    <rect x="100" y="400" width="100" height="100" fill="#fff" />
    <rect x="200" y="400" width="100" height="100" fill="#000" />
    <rect x="300" y="400" width="100" height="100" fill="#000" />
    <rect x="400" y="400" width="100" height="100" fill="#000" />
    <rect x="500" y="400" width="100" height="100" fill="#111" />
